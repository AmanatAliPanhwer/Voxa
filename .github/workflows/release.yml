name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
          - os: windows-latest
          - os: macos-15
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.os }}
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Voxa v__VERSION__"
          releaseBody: "Download the installer for your platform. Binaries are unsigned, so Windows SmartScreen and macOS Gatekeeper will warn on first run."
          releaseDraft: true
          args: ${{ matrix.platform.target && format('--target {0}', matrix.platform.target) || '' }}