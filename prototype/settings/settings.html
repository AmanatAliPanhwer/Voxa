<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxa Settings — prototype (wayfinder #9)</title>
<!--
  PROTOTYPE (throwaway, wayfinder ticket: prototype: settings surface).
  Three structurally different settings surfaces for the Voxa dictation app,
  switchable via ?variant=A|B|C and the floating bar below.
  Deadline: react and one of these (or a mix) becomes the spec's settings chapter.
  No persistence, no build, double-click this file.
-->
<style>
  :root{
    --bg:#0b0d12; --panel:#151922; --panel2:#1b2029; --row:#1a1f29; --row2:#232936;
    --line:#262d3b; --text:#e8ebf2; --dim:#9aa3b5; --faint:#6b7385;
    --accent:#4fc8b8; --accent-dim:rgba(79,200,184,.14); --warn:#ffb86b; --bad:#ff7d7d; --ok:#62d98a;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 800px at 70% -10%,#141926 0%,var(--bg) 60%);color:var(--text);
    font:14px/1.45 -apple-system,"Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:56px 24px 90px}
  .win{width:100%;max-width:880px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .titlebar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
  .titlebar .dot{width:10px;height:10px;border-radius:50%}
  .titlebar .name{font-weight:600;font-size:13px;letter-spacing:.2px}
  .titlebar .sub{margin-left:auto;color:var(--faint);font-size:11px}
  .titlebar .ttr{margin-left:8px;font-size:11px;color:var(--dim);border:1px solid var(--line);padding:3px 8px;border-radius:99px}
  h2.sec{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 8px;font-weight:600}
  button{font:inherit;background:var(--row2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:#3a4559}
  button.primary{background:var(--accent);border-color:transparent;color:#05221e;font-weight:600}

  /* ---------------- shared row primitives ---------------- */
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px}
  .row .lbl{flex:1;min-width:0}
  .row .lbl .t{font-weight:500}
  .row .lbl .n{color:var(--faint);font-size:12px;margin-top:1px}
  .row .ctl{flex:none;display:flex;align-items:center;gap:8px}
  .tg{width:38px;height:22px;border-radius:99px;background:var(--row2);border:1px solid var(--line);position:relative;cursor:pointer;transition:.15s}
  .tg.on{background:var(--accent);border-color:var(--accent)}
  .tg:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#e8ebf2;transition:.15s}
  .tg.on:after{left:18px}
  .seg{display:inline-flex;background:var(--row2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .seg button{background:transparent;border:0;border-radius:7px;padding:4px 11px;color:var(--dim)}
  .seg button.on{background:var(--row2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  select{background:var(--row2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;max-width:220px}
  input[type=password]{background:var(--row2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;width:230px}
  .kbtn{background:var(--row2);border:1px dashed #3b4557;border-radius:8px;padding:7px 12px;font:12px var(--mono);color:var(--text);min-width:132px;text-align:center}
  .kbtn.cap{border-style:solid;border-color:var(--accent)}
  .meter{width:220px;height:26px;background:var(--row2);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
  .meter .f{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#334155,#4fc8b8 70%,#ffb86b);opacity:.85}
  .meter .min,.meter .max{position:absolute;top:50%;transform:translateY(-50%);font-size:9px;color:var(--faint)}
  .meter .min{left:6px}.meter .max{right:6px}
  .link{color:var(--accent);background:none;border:0;padding:0;cursor:pointer;font-size:12px}
  .badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:rgba(98,217,138,.4)}
  .badge.warn{color:var(--warn);border-color:rgba(255,184,107,.4)}
  .note{font-size:12px;color:var(--faint);margin:2px 0 0}

  /* ---------------- variant A: sidebar / native prefs ---------------- */
  #vA{display:flex;min-height:520px}
  #vA nav{width:210px;border-right:1px solid var(--line);background:rgba(255,255,255,.015);padding:14px 10px}
  #vA nav .navrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;color:var(--dim);cursor:pointer;font-size:13px}
  #vA nav .navrow.on{background:var(--accent-dim);color:var(--text)}
  #vA nav .navrow .ic{width:16px;text-align:center}
  #vA nav .owner{margin:4px 0 14px;padding:8px 12px;color:var(--faint);font-size:12px;border-bottom:1px solid var(--line)}
  #vA .pane{flex:1;overflow:auto;padding:22px 26px 26px}
  #vA .pane .rows{border:1px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden}
  #vA .pane .row + .row{border-top:1px solid var(--line)}
  #vA .pane .foot{margin-top:18px;display:flex;justify-content:flex-end}

  /* ---------------- variant B: single scroll + search ---------------- */
  #vB{max-width:680px;margin:0 auto}
  #vB .head{padding:22px 26px 14px}
  #vB .search{display:flex;align-items:center;gap:10px;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:14px}
  #vB .search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit}
  #vB .search .k{margin-left:auto;font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
  #vB .body{padding:0 26px 26px}
  #vB .card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
  #vB .card .chead{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
  #vB .card .chead .ic{width:20px;text-align:center}
  #vB .card .chead .t{font-weight:600}
  #vB .card .chead .cnt{margin-left:auto;font-size:11px;color:var(--faint)}
  #vB .card .row + .row{border-top:1px solid var(--line)}
  #vB .row.fade{opacity:.18}
  #vB .bottom{text-align:center;color:var(--faint);font-size:12px;padding:6px 0 4px}

  /* ---------------- variant C: tiered / progressive ---------------- */
  #vC{max-width:640px;margin:0 auto}
  #vC .status{display:flex;gap:18px;padding:16px 20px;border-bottom:1px solid var(--line);align-items:center;background:rgba(255,255,255,.015)}
  #vC .status .chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  #vC .status .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  #vC .status .chip .dot.ok{background:var(--ok);box-shadow:0 0 8px rgba(98,217,138,.7)}
  #vC .status .chip .dot.bad{background:var(--bad)}
  #vC .body{padding:18px 20px 24px}
  #vC .tier{background:var(--panel2);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  #vC .tier .tierhead{display:flex;align-items:center;gap:10px;padding:13px 18px;cursor:pointer;user-select:none}
  #vC .tier .tierhead .t{font-weight:600;font-size:13px}
  #vC .tier .tierhead .d{color:var(--faint);font-size:12px}
  #vC .tier .tierhead .chev{margin-left:auto;color:var(--faint);transition:.15s}
  #vC .tier.collapsed .chev{transform:rotate(-90deg)}
  #vC .tier .tierbody{border-top:1px solid var(--line)}
  #vC .tier.collapsed .tierbody{display:none}
  #vC .tier .row + .row{border-top:1px solid var(--line)}
  #vC .tier.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 14px 40px rgba(79,200,184,.10)}
  #vC .footer{display:flex;justify-content:space-between;align-items:center;color:var(--faint);font-size:12px;padding:2px 4px}

  /* ---------------- switcher ---------------- */
  #sw{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;
    background:#07080c;border:1px solid #2c3342;border-radius:99px;padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:40}
  #sw button{background:none;border:0;color:var(--text);font-size:16px;padding:4px 10px;border-radius:50%;cursor:pointer}
  #sw button:hover{background:var(--row2)}
  #sw .lab{min-width:230px;text-align:center;font-size:12px;color:var(--dim)}
  #sw .lab b{color:var(--text)}
  #sw .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
  #sw .treebtn{font-size:12px;padding:4px 10px;border-radius:99px;color:var(--dim)}
  #sw .treebtn.on{color:var(--accent)}

  /* ---------------- settings-tree panel ---------------- */
  #tree{position:fixed;right:0;top:0;bottom:0;width:520px;max-width:92vw;background:#0e1117;border-left:1px solid var(--line);
    box-shadow:-20px 0 60px rgba(0,0,0,.5);z-index:50;display:none;overflow:auto;padding:20px}
  #tree.open{display:block}
  #tree h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin:0 0 4px}
  #tree p.sub{color:var(--faint);font-size:12px;margin:0 0 18px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid #1c2230;vertical-align:top}
  td.key{font-family:var(--mono);font-size:11.5px;color:var(--accent)}
  td.ctl{color:var(--dim)}
  td.str{font-family:var(--mono);font-size:11px;color:var(--faint)}
  td.str.keychain{color:var(--warn)}
  tr.g td:first-child{color:var(--faint);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding-top:14px;border-bottom:0}
</style>
</head>
<body>

<main id="stage"></main>

<div id="sw">
  <button id="prev" title="Previous variant">◀</button>
  <div class="lab" id="lab">—</div>
  <button id="next" title="Next variant">▶</button>
  <span class="sep"></span>
  <button class="treebtn" id="treebtn">▤ Settings tree</button>
</div>

<div id="tree">
  <h2>Voxa settings inventory → settings tree</h2>
  <p class="sub">One row per control: <b>key</b> = storage key in the plain settings file (<span class="str">appDataDir/config.json</span>), unless <span class="str keychain">keychain</span>. Derived live from the same data the three variants render.</p>
  <table><thead><tr><th>Setting</th><th>Control</th><th>Storage key</th></tr></thead><tbody id="treebody"></tbody></table>
</div>

<script>
/* ==================== settings inventory (single source of truth) ==================== */
const GROUPS = ['General','Activation','Microphone','Model','Cleanup','Advanced'];
const TREE = [
  {g:'General',   key:'app.launch_at_login', label:'Launch at login', control:'toggle', on:true,  note:'Start Voxa quietly when you log in. First-run default off.'},
  {g:'General',   key:'app.theme',           label:'Theme',           control:'seg', options:['System','Light','Dark'], value:'System', note:'Applies to the pill and this window.'},
  {g:'General',   key:'app.language',        label:'Language',        control:'locked', value:'English (US)', note:'v1 dictation is English-only. Non-English cleanup is a follow-up; the slot stays.'},
  {g:'General',   key:'app.last_update_check', label:'Updates',       control:'info', note:'v1 checks manually (Button → GitHub Releases). Auto-update / signing: v1.x.'},
  {g:'Activation',key:'activation.mode',     label:'Activation mode', control:'seg', options:['Hold-to-talk','Hands-free'], value:'Hold-to-talk', note:'Hold:halt vs hold:rest — one clip per activation either way.'},
  {g:'Activation',key:'activation.hotkey',   label:'Global hotkey',   control:'hotkey', value:'Ctrl+Win+B', note:'Windows/macOS/X11. Wayland: no global key — tray/pill click instead (note shows).'},
  {g:'Microphone',key:'mic.device',          label:'Input device',    control:'select', options:['Default microphone','Microphone (USB Audio)','Internal Microphone'], value:'Default microphone', note:'Blank = OS default. Churn/resample handled on a worker thread.'},
  {g:'Microphone',key:'mic.levels',          label:'Input level',     control:'meter', note:'/-60..0 dBFS, gate −55/−70. Silence should sit still; sustained flat zero = mic permission? deep-link here.'},
  {g:'Model',     key:'model.id',            label:'Whisper model',   control:'model', value:'small.en', note:'Downloaded once, cached offline. Missing model auto-downloads on first clip.'},
  {g:'Cleanup',   key:'cleanup.enabled',     label:'Clean up transcripts', control:'toggle', on:true, note:'External polish of the raw transcript. Off ⇒ insert raw as-is.'},
  {g:'Cleanup',   key:'cleanup.tone',        label:'Tone preset',     control:'seg', options:['Plain','Casual','Formal','Email'], value:'Plain', note:'Four named cleanup styles; identical engine, different system prompt.'},
  {g:'Cleanup',   key:'groq_api_key',        label:'Groq API key',    control:'key', note:'Never written to disk — lives in the OS keychain only. Free key: console.groq.com (no card).'},
  {g:'Advanced',  key:'app.reveal_logs',     label:'Diagnostics log', control:'button', action:'Reveal logs', note:'Opens the log file for bug reports. Errors surface on the pill, detail lives here.'},
  {g:'Advanced',  key:'app.reset',           label:'Reset all settings', control:'reset', note:'Restores defaults. The API key in the keychain is left alone.'},
];

const MODELS = [
  {id:'tiny.en',   disk:'~74 MB',   ram:'~273 MB',  speed:'Fastest', def:false},
  {id:'base.en',   disk:'~141 MB',  ram:'~388 MB',  speed:'Very fast', def:false},
  {id:'small.en',  disk:'~465 MB',  ram:'~852 MB',  speed:'Fast · balanced', def:true},
  {id:'medium.en', disk:'~1.43 GiB',ram:'~2.1 GB',  speed:'Slower · best quality', def:false},
];

/* ==================== state & shared pieces ==================== */
const S = { hotkey:'Ctrl+Win+B', capture:false, meter:0, meterOn:false, search:'', tierCol:{1:true,2:true,3:true}, key:'small.en', tree:false };

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function row(html, label, note){
  return `<div class="row"><div class="lbl"><div class="t">${label}</div>${note?`<div class="n">${note}</div>`:''}</div><div class="ctl">${html}</div></div>`;
}
function toggle(entry){
  const on = entry.on ? ' on' : '';
  return row(`<div class="tg${on}" data-key="${entry.key}" data-ctl="toggle" data-on="${on?'1':'0'}"></div>`, entry.label, entry.note);
}
function seg(entry){
  const btns = entry.options.map((o,i)=>`<button class="${o===entry.value?'on':''}" data-ctl="seg" data-idx="${i}" data-opt="${esc(o)}">${o}</button>`).join('');
  return row(`<div class="seg">${btns}</div>`, entry.label, entry.note);
}
function selectCtl(entry){
  const opts = entry.options.map(o=>`<option ${o===entry.value?'selected':''}>${esc(o)}</option>`).join('');
  return row(`<select data-ctl="select">${opts}</select>`, entry.label, entry.note);
}
function hotkey(entry){
  const note = (entry.key==='activation.hotkey') ? 'Wayland: no global key — tray/pill click.' : entry.note;
  return row(`<button class="kbtn" data-ctl="hotkey" id="hkbtn">${esc(S.hotkey)}</button>`, entry.label, note);
}
function keyInput(){
  return row(`
    <input type="password" placeholder="gsk_…" data-ctl="key" autocomplete="off">
    <button class="link" data-ctl="keylink">Get a free key</button>
    <button data-ctl="keytest" title="Validate the key">Test</button>`,
    'Groq API key',
    'Only written to the OS keychain — never to the settings file.');
}
function meter(){
  return row(`<div class="meter"><div class="f" id="meterf" style="transform:scaleX(0)"></div><span class="min">-60</span><span class="max">0 dBFS</span></div>
    <button data-ctl="metertest" id="metertoggle">Start test</button>`, 'Input level', '/-60..0 dBFS meter; silence sits still. If it stays flat at zero, the mic is blocked — Settings deep-link.');
}
function models(){
  const opts = MODELS.map(m=>{
    const sel = m.id===S.key ? 'checked' : '';
    return `<label style="display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer">
      <input type="radio" name="model" value="${m.id}" ${sel} data-ctl="model">
      <span style="min-width:92px;font-family:var(--mono);font-size:12px">${m.id}${m.def?' <span class="badge ok">default</span>':''}</span>
      <span style="color:var(--dim);font-size:12px;min-width:70px">${m.disk} · ${m.ram}</span>
      <span style="color:var(--faint);font-size:12px;margin-left:auto">${m.speed}</span>
    </label>`;
  }).join('');
  const sel = MODELS.find(m=>m.id===S.key);
  const status = sel
    ? (S.key==='small.en' ? '<span class="badge ok" id="modelstatus">Downloaded · 465 MB</span>' : '<span class="badge" id="modelstatus">Not installed</span>')
    : '<span class="badge" id="modelstatus">Not installed</span>';
  return row(`${opts}<div style="display:flex;width:100%;justify-content:flex-end">${status}<button class="link" data-ctl="dl">Download now</button></div>`, 'Whisper model', 'Model size vs memory vs latency. First download: a few minutes, progress shows here and on the pill; offline after.');
}
function buttonRow(entry){
  const inner = entry.control==='reset'
    ? `<button data-ctl="reset" style="border-color:#5a2b2b;color:#ff9f9f">Reset all settings</button>`
    : `<button data-ctl="logs">${entry.action}</button>`;
  return row(inner, entry.label, entry.note);
}
function locked(entry){
  return row(`<span class="badge">${esc(entry.value)}</span> <span class="badge">More later</span>`, entry.label, entry.note);
}
function info(entry){
  return row(`<button data-ctl="checkupd">Check for updates</button>`, entry.label, entry.note);
}

function rowsFor(group){
  return TREE.filter(e=>e.g===group).map(e=>{
    switch(e.control){
      case 'toggle': return toggle(e);
      case 'seg':    return seg(e);
      case 'select': return selectCtl(e);
      case 'hotkey': return hotkey(e);
      case 'key':    return keyInput();
      case 'meter':  return meter();
      case 'model':  return models();
      case 'button': return buttonRow(e);
      case 'locked': return locked(e);
      case 'info':   return info(e);
    }
  }).join('');
}

/* ==================== variant A — native sidebar preferences ==================== */
const A_ICONS = {General:'⚙',Activation:'⌨',Microphone:'🎙',Model:'📦',Cleanup:'✨',Advanced:'🧰'};
function variantA(){
  S.active='General';
  return `<div class="win" id="vA">
    <div class="titlebar"><div class="dot" style="background:#ff5f57"></div><div class="dot" style="background:#febc2e"></div><div class="dot" style="background:#28c840"></div>
      <div class="name">Voxa Settings</div><div class="sub">v0.1.0</div></div>
    <div style="display:flex">
      <nav>
        <div class="owner">Amanat<br><span style="font-size:11px">belongs to you, stays on your machine</span></div>
        ${GROUPS.map(g=>`<div class="navrow" data-nav="${g}" data-ctl="nav"><span class="ic">${A_ICONS[g]}</span>${g}</div>`).join('')}
      </nav>
      <div class="pane" id="paneA">
        <h2 class="sec" id="paneATitle">General</h2>
        <div class="rows" id="paneARows">${rowsFor('General')}</div>
        <div class="foot"><button class="primary">Done</button></div>
      </div>
    </div>
  </div>`;
}

/* ==================== variant B — single scroll + search cards ==================== */
function variantB(){
  return `<div class="win" id="vB">
    <div class="titlebar"><div class="name">Voxa</div><div class="ttr">Settings</div><div class="sub">Everything on one page — type to filter</div></div>
    <div class="head">
      <div class="search"><span style="color:var(--faint)">⌕</span><input id="searchInput" placeholder="Search settings — try “hotkey” or “model”" autocomplete="off"><span class="k">/</span></div>
    </div>
    <div class="body">${GROUPS.map(g=>`
      <div class="card" data-card="${g}">
        <div class="chead"><span class="ic">${A_ICONS[g]}</span><span class="t">${g}</span><span class="cnt">${TREE.filter(e=>e.g===g).length}</span></div>
        ${rowsFor(g)}
      </div>`).join('')}
      <div class="bottom">Nothing here is saved — this is a feel-the-shape prototype.</div>
    </div>
  </div>`;
}

/* ==================== variant C — tiered, progressive disclosure ==================== */
function variantC(){
  const essentials = ['activation.hotkey','activation.mode','cleanup.enabled','groq_api_key'];
  const power     = ['mic.device','mic.levels','model.id','cleanup.tone','app.theme','app.launch_at_login'];
  const trouble   = ['app.language','app.last_update_check','app.reveal_logs','app.reset'];
  const tier = (title, desc, keys, collapsed, hl)=>{
    const rows = TREE.filter(e=>keys.includes(e.key)).map(e=>{
      switch(e.control){
        case 'toggle': return toggle(e);
        case 'seg':    return seg(e);
        case 'select': return selectCtl(e);
        case 'hotkey': return hotkey(e);
        case 'key':    return keyInput();
        case 'meter':  return meter();
        case 'model':  return models();
        case 'button': return buttonRow(e);
        case 'locked': return locked(e);
        case 'info':   return info(e);
      }
    }).join('');
    return `<div class="tier${hl?' hl':''}${collapsed?' collapsed':''}" data-ctl="tier">
      <div class="tierhead"><span class="chev">▼</span><span class="t">${title}</span><span class="d">${desc}</span></div>
      <div class="tierbody">${rows}</div>
    </div>`;
  };
  return `<div class="win" id="vC">
    <div class="titlebar"><div class="name">Voxa</div><div class="sub">dictation · local by default</div></div>
    <div class="status">
      <div class="chip"><span class="dot ok"></span>Microphone · working</div>
      <div class="chip"><span class="dot ok"></span>Model · small.en installed</div>
      <div class="chip"><span class="dot"></span>Cleanup · key missing</div>
      <div class="chip"><span class="dot"></span>Hotkey · Ctrl+Win+B</div>
    </div>
    <div class="body">
      ${tier('Essentials','your daily three', essentials, false, true)}
      ${tier('Power user','shape the engines', power, false)}
      ${tier('Troubleshooting','get unstuck', trouble, true)}
      <div class="footer"><span>Voxa 0.1.0 · settings live in your app data, cleaned in your keychain</span><span>23 KB of config</span></div>
    </div>
  </div>`;
}

/* ==================== switcher ==================== */
const VARIANTS = [
  ['A','Native sidebar preferences'],
  ['B','Single scroll + search cards'],
  ['C','Tiered: Essentials → Power → Troubleshoot'],
];
let v = new URLSearchParams(location.search).get('variant') || 'B';

function render(){
  S.active='General';
  const stage = document.getElementById('stage');
  if(v==='A') stage.innerHTML = variantA();
  else if(v==='B') stage.innerHTML = variantB();
  else stage.innerHTML = variantC();
  bind();
  document.getElementById('lab').innerHTML = `<b>${v}</b> · ${VARIANTS.find(x=>x[0]===v)[1]} — use ◀ ▶ or ← →`;
}
function setV(nv){
  v = nv;
  history.replaceState(null,'','?variant='+v);
  render();
}

/* ==================== behavior ==================== */
let hkCapture = false;
function bind(){
  document.querySelectorAll('[data-ctl]').forEach(el=>{
    const ctl = el.dataset.ctl;

    if(ctl==='nav'){
      el.addEventListener('click',()=>{
        document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('on',n===el));
        document.getElementById('paneATitle').textContent = el.dataset.nav;
        document.getElementById('paneARows').innerHTML = rowsFor(el.dataset.nav);
      });
    }

    if(ctl==='toggle'){
      el.addEventListener('click',()=>{
        const on = el.dataset.on==='1' ? '0' : '1';
        el.dataset.on = on; el.classList.toggle('on',on==='1');
      });
    }
    if(ctl==='seg'){
      el.addEventListener('click',()=>{
        el.parentElement.querySelectorAll('[data-ctl="seg"]').forEach(b=>b.classList.remove('on'));
        el.classList.add('on');
      });
    }
    if(ctl==='hotkey'){
      el.addEventListener('click',()=>{
        el.classList.add('cap'); el.textContent = 'Press any key…';
        hkCapture = true;
      });
    }
    if(ctl==='key'){ /* nothing on typing — prototype */ }
    if(ctl==='keylink'){ el.addEventListener('click',()=>el.textContent='→ console.groq.com (opens free key page in the spec)'); }
    if(ctl==='keytest'){ el.addEventListener('click',()=>{ el.textContent='✓ key valid (probe of /models)'; el.style.color='var(--ok)'; }); }
    if(ctl==='metertest'){
      el.addEventListener('click',()=>{
        S.meterOn = !S.meterOn; el.textContent = S.meterOn ? 'Stop' : 'Start test';
        if(S.meterOn){ S.meterInt = setInterval(()=>{ const f=document.getElementById('meterf'); if(f&&S.meterOn){ f.style.transform='scaleX('+(S.meter<0.04?0:S.meter+(Math.random()-.5)*.22)+')'; } },90); }
        else { clearInterval(S.meterInt); const f=document.getElementById('meterf'); if(f) f.style.transform='scaleX(0)'; }
      });
    }
    if(ctl==='model'){
      el.addEventListener('change',()=>{
        S.key=el.value;
        document.querySelectorAll('input[data-ctl="model"]').forEach(r=>r.checked = r.value===S.key);
        const st=document.getElementById('modelstatus');
        if(st){ st.textContent = S.key==='small.en' ? 'Downloaded · 465 MB' : 'Not installed';
                st.className = 'badge' + (S.key==='small.en'?' ok':''); }
      });
    }
    if(ctl==='tier'){
      el.querySelector('.tierhead').addEventListener('click',()=>el.classList.toggle('collapsed'));
    }
    if(ctl==='checkupd') el.addEventListener('click',()=>el.textContent='✓ Running 0.1.0 — up to date (checked GitHub Releases)');
    if(ctl==='logs') el.addEventListener('click',()=>el.textContent='Logs revealed (path in spec)');
    if(ctl==='reset') el.addEventListener('click',()=>{ if(confirm('Reset all settings? This is a prototype confirm.')) el.textContent='✓ Reset (keychain key untouched)'; });
  });

  // variant B search
  const si = document.getElementById('searchInput');
  if(si){
    si.addEventListener('input',()=>{
      const q=(si.value||'').toLowerCase().trim();
      document.querySelectorAll('#vB .card').forEach(card=>{
        let any=false;
        card.querySelectorAll('.row').forEach(r=>{
          const hit=!q || r.textContent.toLowerCase().includes(q);
          r.classList.toggle('fade',!hit); if(hit) any=true;
        });
        card.style.opacity = any ? '1' : (q?'0.25':'1');
      });
    });
  }
}
document.addEventListener('keydown',e=>{
  if(hkCapture){ hkCapture=false; S.hotkey = e.key.length===1 ? 'Ctrl+Win+'+e.key.toUpperCase() : (e.key==='Control'?'Ctrl':e.key);
    const b=document.getElementById('hkbtn'); if(b){ b.textContent=S.hotkey; b.classList.remove('cap'); }
    return; }
  const t=e.target;
  if(t && (t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if(e.key==='ArrowLeft'){ setV(VARIANTS[( (VARIANTS.findIndex(x=>x[0]===v)-1+VARIANTS.length) % VARIANTS.length)][0]); }
  if(e.key==='ArrowRight'){ setV(VARIANTS[( VARIANTS.findIndex(x=>x[0]===v)+1 ) % VARIANTS.length][0]); }
});
document.getElementById('prev').addEventListener('click',()=>setV(VARIANTS[((VARIANTS.findIndex(x=>x[0]===v)-1+VARIANTS.length)%VARIANTS.length)][0]));
document.getElementById('next').addEventListener('click',()=>setV(VARIANTS[(VARIANTS.findIndex(x=>x[0]===v)+1)%VARIANTS.length][0]));

/* ==================== settings tree panel ==================== */
document.getElementById('treebtn').addEventListener('click',()=>{
  const tr=document.getElementById('tree'), btn=document.getElementById('treebtn');
  const open=!tr.classList.contains('open');
  tr.classList.toggle('open',open); btn.classList.toggle('on',open);
});
(function buildTree(){
  const tb=document.getElementById('treebody');
  tb.innerHTML = GROUPS.map(g=>{
const rows = TREE.filter(e=>e.g===g).map(e=>{
      const storage = e.control==='key' ? '<span class="str keychain">keychain · groq_api_key</span>' : `<span class="str">config.json → ${e.key}</span>`;
      return `<tr><td><b>${e.label}</b></td><td class="ctl">${e.control}</td><td>${storage}</td></tr>`;
    }).join('');
    return `<tr class="g"><td colspan="3">${g}</td></tr>${rows}`;
  }).join('');
})();

render();
</script>
</body>
</html>
