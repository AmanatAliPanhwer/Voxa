<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway, do not ship.
  Three pill directions for Voxa, switchable via ?variant=a|b|c (floating bar at bottom).
  Question: what should the pill look like, and how should it behave across states,
  such that the metering is honest (silence = still)?
  Meter pipeline mirrors R3: ~50ms RMS window, attack ~45ms / release ~220ms smoothing,
  -60/-50 dB hysteresis gate -> true silence renders bars STILL.
  Run: open this file in a browser. Hold Space or the "Hold to speak" button to talk.
-->
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxa pill — prototype</title>
<style>
  :root {
    --accent-a: #67e8f9;          /* A: sky cyan  */
    --accent-b: #a78bfa;          /* B: violet    */
    --accent-c1: #22d3ee;         /* C: cyan      */
    --accent-c2: #a78bfa;         /* C: violet    */
    --err: #fb7185;
    --ok:  #34d399;
    --warn:#fbbf24;
  }
  [data-theme="dark"] {
    --stage1:#0b0d12; --stage2:#141822;
    --glass:rgba(16,20,30,.55); --glass-brd:rgba(255,255,255,.10);
    --ink:#e7ecf5; --ink-dim:#8b93a7; --ink-faint:#5b6377;
    --panel:rgba(255,255,255,.04);
  }
  [data-theme="light"] {
    --stage1:#eef1f6; --stage2:#dfe4ee;
    --glass:rgba(255,255,255,.62); --glass-brd:rgba(15,23,42,.14);
    --ink:#141a2a; --ink-dim:#5a6378; --ink-faint:#99a2b5;
    --panel:rgba(15,23,42,.05);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    font: 13px/1.45 "Inter","Segoe UI",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--stage1),var(--stage2));
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }

  /* ---------- stage ---------- */
  .stage { position:fixed; inset:0 0 0 0; overflow:hidden; }
  .stage-grid {
    position:absolute; inset:0;
    background-image:linear-gradient(var(--ink-faint) 1px, transparent 1px),
                     linear-gradient(90deg, var(--ink-faint) 1px, transparent 1px);
    background-size:44px 44px; opacity:.10; pointer-events:none;
  }
  .fwin { position:absolute; border-radius:10px; border:1px solid var(--glass-brd);
          background:var(--panel); box-shadow:0 20px 50px -22px rgba(0,0,0,.55);
          overflow:hidden; }
  .fwin .bar { height:30px; display:flex; align-items:center; gap:6px; padding:0 10px;
               border-bottom:1px solid var(--glass-brd); }
  .fwin .bar i { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .fwin .bar b { font-weight:600; font-size:11px; color:var(--ink-dim); margin-left:6px; }
  .fwin .body { padding:12px 14px; color:var(--ink-dim); }
  .fwin .body p { height:7px; border-radius:4px; background:var(--glass-brd); margin-bottom:8px; }
  #wNotes  { left:8%;  top:16%; width:300px; height:190px; opacity:.85; }
  #wNotes  .bar i:nth-child(1){background:#ff5f57} #wNotes .bar i:nth-child(2){background:#febc2e}
  #wNotes  .bar i:nth-child(3){background:#28c840}
  #wBrowser{ right:8%; top:22%; width:340px; height:150px; opacity:.7; }
  #wBrowser .bar i:nth-child(1){background:#ff5f57} #wBrowser .bar i:nth-child(2){background:#febc2e}
  #wBrowser .bar i:nth-child(3){background:#28c840}
  .fwin .body p:nth-child(3){ width:64%; }
  .fwin .body p:nth-child(4){ width:48%; }
  #wNotes .caret { height:15px; width:2px; background:var(--accent-b); display:inline-block;
                   vertical-align:-3px; animation:blink 1s steps(1) infinite; opacity:.8; }
  @keyframes blink { 50% { opacity:0 } }
  .stage-note { position:absolute; left:50%; transform:translateX(-50%); top:58px;
    font-size:10.5px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase;
    text-align:center; line-height:1.7; pointer-events:none; white-space:nowrap; }

  /* ---------- pill container (docked bottom-center of stage) ---------- */
  .pillwrap { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
              display:flex; align-items:center; justify-content:center; cursor:grab; }
  .pillwrap.dragging { cursor:grabbing; }

  /* ================= VARIANT A — capsule dock ================= */
  .pillA {
    position:relative; height:36px; min-width:152px; max-width:560px;
    border-radius:999px; padding:0 12px;
    background:var(--glass); backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-brd);
    box-shadow:0 14px 34px -16px rgba(0,0,0,.6);
    display:flex; align-items:center; gap:9px;
  }
  .pillA .dot { width:6px; height:6px; border-radius:50%; background:var(--accent-a);
                box-shadow:0 0 0 0 rgba(103,232,249,.5); flex:0 0 auto; }
  .pillA.state-listening .dot { animation:dotPulse 1.4s infinite; }
  .pillA.state-handsfree .dot { animation:dotPulse 2s infinite; background:transparent; border:1.5px solid var(--accent-a); }
  @keyframes dotPulse { 0%{box-shadow:0 0 0 0 rgba(103,232,249,.55)} 70%{box-shadow:0 0 0 9px rgba(103,232,249,0)} 100%{box-shadow:0 0 0 0 rgba(103,232,249,0)} }
  .pillA.state-error .dot { background:var(--err); box-shadow:none; animation:none; }
  .pillA.state-done   .dot { background:var(--ok); box-shadow:none; animation:none; }
  .pillA.state-cleaning .dot { background:var(--warn); animation:none; }
  .pillA .label { font-size:11.5px; letter-spacing:.01em; white-space:nowrap; color:var(--ink-dim); }
  .pillA.state-listening .label, .pillA.state-handsfree .label { color:var(--ink); }
  .pillA.state-transcribing .label, .pillA.state-cleaning .label { color:var(--ink); }
  .pillA .meters { display:flex; align-items:center; gap:2px; height:20px; flex:0 0 auto; }
  .pillA .meters i { width:3px; border-radius:1px; background:var(--accent-a); height:2px;
                     transition:height .05s linear; }
  .pillA.state-cleaning .meters i { background:var(--warn); }
  .pillA .btn { width:16px; height:16px; border:none; border-radius:50%; cursor:pointer;
                flex:0 0 auto; display:flex; align-items:center; justify-content:center;
                background:transparent; color:var(--ink-dim); font-size:11px; padding:0;
                transition:background .15s,color .15s; }
  .pillA .btn:hover { background:var(--panel); color:var(--ink); }
  .pillA .btn.cancel { display:none; }
  .pillA.state-listening .btn.cancel { display:flex; }
  .pillA .ctrl { display:none; align-items:center; gap:2px; }
  .pillA.state-listening .ctrl, .pillA.state-transcribing .ctrl, .pillA.state-cleaning .ctrl,
  .pillA.state-inserting .ctrl, .pillA.state-handsfree .ctrl { display:flex; }
  .pillA .hint { display:none; font-size:10.5px; color:var(--ink-faint); white-space:nowrap; letter-spacing:.04em; }
  .pillA.state-idle .hint { display:inline; }
  .pillA.state-error .hint { display:inline; color:var(--err); }
  .pillA.state-handsfree .hint { display:inline; color:var(--accent-a); }
  .pillA .progress { position:absolute; left:24px; right:24px; bottom:-1px; height:2px;
                     border-radius:2px; background:transparent; display:none; overflow:hidden; }
  .pillA.state-inserting .progress { display:block; }
  .pillA.state-transcribing .progress, .pillA.state-cleaning .progress { display:block; }
  .pillA .progress i { position:absolute; left:0; top:0; bottom:0; width:0%;
                       background:linear-gradient(90deg,var(--accent-a),var(--accent-c2)); border-radius:2px;
                       transition:width .09s linear; }
  .pillA.state-transcribing .progress i, .pillA.state-cleaning .progress i {
    width:36% !important; transition:none; animation:shimmerA 1.1s ease-in-out infinite;
    background:linear-gradient(90deg,transparent,var(--accent-a),transparent);
  }
  @keyframes shimmerA { 0%{transform:translateX(-110%)} 100%{transform:translateX(320%)} }
  .pillA.state-done { animation:doneFlashA .6s ease; }
  @keyframes doneFlashA { 0%{box-shadow:0 14px 34px -16px rgba(0,0,0,.6),0 0 0 0 rgba(52,211,153,.7)}
                          45%{box-shadow:0 14px 34px -16px rgba(0,0,0,.6),0 0 0 14px rgba(52,211,153,0)}
                          100%{box-shadow:0 14px 34px -16px rgba(0,0,0,.6),0 0 0 0 rgba(52,211,153,0)} }

  /* ================= VARIANT B — status console ================= */
  .pillB {
    position:relative; width:348px; height:62px; border-radius:18px;
    background:var(--glass); backdrop-filter:blur(18px) saturate(1.4); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-brd);
    box-shadow:0 22px 44px -20px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07);
    display:grid; grid-template-columns:22px 1fr auto 40px; align-items:center;
    gap:8px; padding:0 10px;
  }
  .pillB .grip { display:flex; flex-direction:column; gap:2px; align-items:center; opacity:.5; }
  .pillB .grip i { width:3px; height:3px; border-radius:50%; background:var(--ink-dim); }
  .pillB .main { display:flex; flex-direction:column; min-width:0; }
  .pillB .main .lbl { font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .pillB .main .sub { font-size:10.5px; color:var(--ink-faint); white-space:nowrap; }
  .pillB.state-listening .main .lbl { color:var(--accent-b); }
  .pillB.state-handsfree .main .lbl { color:var(--accent-b); }
  .pillB .meters { display:flex; align-items:center; gap:2px; height:22px; }
  .pillB .meters i { width:3px; border-radius:1.5px; height:2px; transition:height .05s linear; }
  .pillB.state-listening  .meters i { background:var(--accent-b); }
  .pillB.state-transcribing .meters i { background:var(--accent-b); }
  .pillB.state-cleaning   .meters i { background:var(--warn); }
  .pillB.state-inserting  .meters i { background:var(--ok); }
  .pillB .actions { display:flex; gap:2px; }
  .pillB .btn { width:24px; height:24px; border:none; border-radius:9px; cursor:pointer;
                background:transparent; color:var(--ink-dim); font-size:12px; display:flex;
                align-items:center; justify-content:center; transition:background .15s,color .15s; }
  .pillB .btn:hover { background:var(--panel); color:var(--ink); }
  .pillB .state-chip { position:absolute; top:-9px; right:12px; font-size:9px; letter-spacing:.08em;
    text-transform:uppercase; padding:2px 8px; border-radius:999px;
    background:var(--panel); border:1px solid var(--glass-brd); color:var(--ink-dim); display:none; }
  .pillB.state-listening .state-chip, .pillB.state-transcribing .state-chip,
  .pillB.state-cleaning .state-chip, .pillB.state-inserting .state-chip,
  .pillB.state-handsfree .state-chip, .pillB.state-error .state-chip { display:inline-block; }
  .pillB .progress { position:absolute; left:22px; right:50px; bottom:0; height:2px; background:transparent; display:none; overflow:hidden; }
  .pillB.state-inserting .progress { display:block; }
  .pillB.state-transcribing .progress, .pillB.state-cleaning .progress { display:block; }
  .pillB .progress i { position:absolute; left:0; top:0; bottom:0; width:0%; border-radius:2px;
                       background:var(--ok); transition:width .09s linear; }
  .pillB.state-transcribing .progress i, .pillB.state-cleaning .progress i {
    width:36% !important; transition:none; background:linear-gradient(90deg,transparent,var(--accent-b),transparent);
    animation:shimmerB 1.1s ease-in-out infinite;
  }
  @keyframes shimmerB { 0%{transform:translateX(-110%)} 100%{transform:translateX(320%)} }
  .pillB.state-idle .meters, .pillB.state-done .meters { display:none; }
  .pillB .errmsg { display:none; color:var(--err); font-size:11px; }
  .pillB.state-error { border-color:rgba(251,113,133,.55); }
  .pillB.state-error .errmsg { display:inline; }
  .pillB.state-error .main .lbl { display:none; }
  .pillB.state-done { animation:doneFlashB .6s ease; }
  @keyframes doneFlashB { 0%{box-shadow:0 22px 44px -20px rgba(0,0,0,.65),0 0 0 0 rgba(52,211,153,.6)}
                          45%{box-shadow:0 22px 44px -20px rgba(0,0,0,.65),0 0 0 16px rgba(52,211,153,0)}
                          100%{box-shadow:0 22px 44px -20px rgba(0,0,0,.65),0 0 0 0 rgba(52,211,153,0)} }

  /* ================= VARIANT C — the orb ================= */
  .pillC { position:relative; display:flex; align-items:center; gap:12px; }
  .pillC .orbwrap { position:relative; width:52px; height:52px; display:flex;
                    align-items:center; justify-content:center; }
  .pillC .orbcore {
    position:absolute; inset:10px; border-radius:50%;
    background:radial-gradient(circle at 34% 30%, var(--accent-c1), var(--accent-c2) 70%);
    box-shadow:0 0 26px -4px rgba(103,232,249,.55); transition:inset .2s ease, opacity .2s ease;
  }
  .pillC.state-idle .orbcore { inset:22px; opacity:.4; box-shadow:none; }
  .pillC.state-listening .orbcore, .pillC.state-handsfree .orbcore { animation:breathe 2.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
  .pillC .ring { position:absolute; inset:0; transform:rotate(-90deg); }
  .pillC .ring .track { fill:none; stroke:var(--glass-brd); stroke-width:2; }
  .pillC .ring .lvl { fill:none; stroke:url(#cgrad); stroke-width:2; stroke-linecap:round; }
  .pillC.state-listening .ring { filter:drop-shadow(0 0 6px rgba(103,232,249,.7)); }
  .pillC .chip {
    display:flex; flex-direction:column; justify-content:center;
    background:var(--glass); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border:1px solid var(--glass-brd); border-radius:12px; padding:8px 12px; min-width:150px;
    box-shadow:0 14px 30px -16px rgba(0,0,0,.6);
  }
  .pillC .chip .lbl { font-size:12.5px; font-weight:600; color:var(--ink); }
  .pillC .chip .sub { font-size:10.5px; color:var(--ink-faint); margin-top:1px; }
  .pillC .chip .ping { display:none; align-items:center; gap:6px; margin-top:5px; font-size:10px; color:var(--accent-c1); }
  .pillC.state-handsfree .chip .ping { display:flex; }
  .pillC .ping i { width:6px; height:6px; border-radius:50%; background:var(--accent-c1); animation:dotPulse 1.6s infinite; }
  .pillC .hit { display:none; font-size:10.5px; color:var(--ink-faint); white-space:nowrap;
                background:var(--glass); border:1px solid var(--glass-brd); border-radius:999px;
                padding:4px 10px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
                letter-spacing:.04em; }
  .pillC.state-idle .hit { display:block; }
  .pillC .pillbtn { width:22px; height:22px; border:none; border-radius:50%; cursor:pointer;
                    background:var(--panel); color:var(--ink); font-size:11px; flex:0 0 auto;
                    display:none; align-items:center; justify-content:center;
                    border:1px solid var(--glass-brd); }
  .pillC.state-listening .pillbtn, .pillC.state-handsfree .pillbtn,
  .pillC.state-transcribing .pillbtn, .pillC.state-cleaning .pillbtn,
  .pillC.state-inserting .pillbtn { display:flex; }
  .pillC .pillbtn:active { color:var(--err); }
  .pillC.state-error .orbcore { background:radial-gradient(circle at 34% 30%, #fb7185, #9f1239 70%);
                                box-shadow:0 0 26px -4px rgba(251,113,133,.5); }
  .pillC.state-done .orbcore { box-shadow:0 0 30px -4px rgba(52,211,153,.7); }

  /* ---------- control bar (prototype scaffolding, NOT product UI) ---------- */
  .controls {
    position:fixed; top:0; left:0; right:0; min-height:46px; display:flex; align-items:center;
    gap:8px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--glass-brd);
    z-index:20; flex-wrap:wrap;
  }
  .controls .grp { display:flex; align-items:center; gap:4px; padding-right:10px;
                   border-right:1px solid var(--glass-brd); margin-right:4px; flex-wrap:wrap; }
  .controls .btn {
    border:1px solid var(--glass-brd); background:var(--panel); color:var(--ink);
    border-radius:7px; padding:5px 9px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .controls .btn:hover { background:rgba(255,255,255,.10); }
  .controls .btn.active { background:rgba(103,232,249,.16); border-color:var(--accent-a); color:var(--accent-a); }
  .controls .btn.handsfree.active { background:rgba(167,139,250,.16); border-color:var(--accent-b); color:var(--accent-b); }
  .controls .btn:hover.handsfree.active { color:var(--accent-b); }
  .controls select {
    border:1px solid var(--glass-brd); background:var(--panel); color:var(--ink);
    border-radius:7px; padding:5px 6px; font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .controls .speak {
    background:linear-gradient(160deg,var(--accent-c1),var(--accent-c2)); color:#08232c;
    font-weight:700; border:none; border-radius:8px; padding:6px 16px; min-width:130px;
  }
  .controls .speak:active { filter:brightness(1.15); }
  .controls .cap { font-size:9.5px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; }

  /* ---------- telemetry (surfaces the honest meter state) ---------- */
  .tele {
    position:fixed; top:54px; right:12px; left:auto; transform:none; z-index:10;
    font:11px ui-monospace,Consolas,monospace; color:var(--ink-dim);
    background:var(--panel); border:1px solid var(--glass-brd); border-radius:8px;
    padding:4px 10px; display:flex; gap:12px; pointer-events:none; white-space:nowrap;
  }
  .tele b { color:var(--ink); font-weight:600; }
  .tele .on  { color:var(--ok); } .tele .off { color:var(--err); }

  /* ---------- variant switcher bar (prototype tooling) ---------- */
  #vsw {
    position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; align-items:center; gap:10px; padding:6px 10px;
    background:#000; color:#fff; border-radius:999px; font-size:12px;
    box-shadow:0 8px 24px rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.18);
    font-family:ui-monospace,Consolas,monospace;
  }
  #vsw button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer;
                padding:0 6px; line-height:1; }
  #vsw button:hover { color:#8fd3ff; }
  #vsw .vl { min-width:156px; text-align:center; }
  #vsw .vl small { color:#aaa; font-size:10px; display:block; }
</style>
</head>
<body>

<div class="stage">
  <div class="stage-grid"></div>
  <div class="stage-note">prototype stage — stand-in for your desktop<br>
    pill floats over the active app · drag the pill · idle pill is click-through (won't steal clicks)</div>
  <div class="fwin" id="wNotes">
    <div class="bar"><i></i><i></i><i></i><b>Notes — Voxa entry</b></div>
    <div class="body">
      <p></p><p></p><p></p><p></p><p></p><p style="width:82%">Standing meeting <span class="caret"></span></p>
    </div>
  </div>
  <div class="fwin" id="wBrowser">
    <div class="bar"><i></i><i></i><i></i><b>Browser</b></div>
    <div class="body"><p></p><p style="width:70%"></p><p></p><p style="width:52%"></p></div>
  </div>

  <div class="pillwrap" id="pillwrap"></div>
</div>

<div class="controls" id="controls"></div>
<div class="tele" id="tele"></div>

<div id="vsw">
  <button id="vprev" title="previous variant">&#9664;</button>
  <div class="vl" id="vlabel"></div>
  <button id="vnext" title="next variant">&#9654;</button>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="cgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
</svg>

<script>
const IS_PROTO = true;                       // gate: switcher not shipped in prod
const GATE  = { on: -60, off: -50 };         // dB hysteresis (R3: -55/-70 gate; feel-tuned)
const ACOEF = 1 - Math.exp(-1/(0.045*60));   // attack  ~45ms  (R3 approx)
const RCOEF = 1 - Math.exp(-1/(0.220*60));   // release ~220ms (R3 approx)

const engine = {
  state: 'idle',          // idle|listening|transcribing|cleaning|inserting|done|error
  error: null,            // mic|model|key
  handsFree: false,
  src: 'sim',             // sim|mic
  speaking: false,
  t: 0, smooth: 0, db: -100, gated: true, level: 0,
  progress: 0,
  micCtx: null, micAn: null,
};

/* ---------- honest audio sources ---------- */
const SYLLABS = [0.55,0.95,0.7,1.0,0.62,0.85,0.5,0.9,0.4,0.75,1.0,0.66,0.82,0.58,0.92,0.68];
function speechSample(t){
  const sy = Math.floor(t/0.16);
  const k  = (t - sy*0.16)/0.16;
  const env = Math.pow(Math.sin(Math.PI*k), 0.7);            // syllable hump
  const amp = SYLLABS[((sy % SYLLABS.length)+SYLLABS.length)%SYLLABS.length];
  const voice = (0.9 + 0.1*Math.sin(2*Math.PI*30*t)) * (1 + 0.05*Math.sin(2*Math.PI*13*t) + 0.04*Math.sin(2*Math.PI*47*t+2));
  const noise = (Math.random()-0.5)*0.05*env;                // fricative-ish
  return Math.max(0.0001, (amp*env*voice + noise)*0.8);
}
async function enableMic(){
  try{
    engine.micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false } });
    const src = engine.micCtx.createMediaStreamSource(stream);
    engine.micAn = engine.micCtx.createAnalyser(); engine.micAn.fftSize = 1024;
    src.connect(engine.micAn);
    engine.src = 'mic'; return true;
  }catch(e){ engine.src='sim'; return false; }
}
function micRms(){
  const buf = new Float32Array(engine.micAn.fftSize);
  engine.micAn.getFloatTimeDomainData(buf);
  let s=0; for(let i=0;i<buf.length;i++) s+=buf[i]*buf[i];
  return Math.sqrt(s/buf.length)*1.5;
}

/* ---------- state transitions ---------- */
function setState(s, err){ engine.state = s; engine.error = err||null; engine.progress = 0; }
function startSession(){ if (engine.state!=='idle') return; setState('listening'); if (engine.handsFree) ping(); }
function endListening(){ chainTo('transcribing'); }
function chainTo(s){
  setState(s);
  if (s==='transcribing') setTimeout(()=>{ if (engine.state==='transcribing') chainTo('cleaning'); }, 1700);
  if (s==='cleaning')     setTimeout(()=>{ if (engine.state==='cleaning')     chainTo('inserting'); }, 900);
  if (s==='inserting')    setTimeout(()=>{ if (engine.state==='inserting')    finishInsert(); }, 1300);
}
function finishInsert(){ setState('done'); setTimeout(()=>{ if (engine.state==='done') setState('idle'); }, 650); }
function cancel(){ setState('idle'); }
function setError(kind){ setState('error', kind); ping(false); }

/* hands-free ping cue (audible + visual ripple) */
function ping(rising=true){
  try{
    if (!engine.micCtx) engine.micCtx = new (window.AudioContext||window.webkitAudioContext)();
    const c = engine.micCtx, o = c.createOscillator(), g = c.createGain();
    o.type='sine'; o.frequency.value = rising?880:392;
    const t=c.currentTime; g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.12,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.32);
  }catch(e){}
  const pop = document.createElement('div');
  pop.style.cssText='position:fixed;left:50%;top:46%;width:120px;height:120px;margin:-60px 0 0 -60px;'+
    'border:2px solid rgba(34,211,238,.6);border-radius:50%;pointer-events:none;z-index:90;'+
    'animation:vrip .55s ease-out forwards;';
  document.body.appendChild(pop); setTimeout(()=>pop.remove(),600);
}
const sty = document.createElement('style');
sty.textContent='@keyframes vrip{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}';
document.head.appendChild(sty);

/* ---------- text per state ---------- */
const ERR_TXT = {
  mic:   { lbl:'Mic offline',      sub:'check your input device',        c:'Mic offline' },
  model: { lbl:'Model missing',    sub:'open Settings to download',      c:'Model missing' },
  key:   { lbl:'No key — raw',     sub:'inserting raw transcript',       c:'No key — raw' },
};
const STATE_TXT = {
  idle:         { a:'Press Ctrl+Win+B',                                     b:'Ready',                     bs:'press Ctrl+Win+B · or click Listen',      c:'press Ctrl+Win+B' },
  listening:    { a:'Listening…',                                           b:'Listening — speak',         bs:'release to stop & transcribe',            c:'speak now' },
  transcribing: { a:'Transcribing…',                                        b:'Whisper is transcribing',   bs:'on-device · small.en',                    c:'transcribing…' },
  cleaning:     { a:'Polishing…',                                           b:'Groq cleanup',              bs:'tone: precise · raw on fail',             c:'polishing…' },
  inserting:    { a:'Inserting…',                                           b:'Inserting',                 bs:'into the active app',                     c:'inserting…' },
  done:         { a:'Inserted ✓',                                           b:'Inserted',                  bs:'check the caret position',                c:'inserted ✓' },
  error:        { a:'',                                                     b:'',                          bs:'',                                       c:'' },
};

/* ---------- render ---------- */
const render = { variant:'a', els:null, active:null };
const HF = () => engine.handsFree && engine.state==='listening';
const HF_CLS = HF; // hands-free is a folded listening class

function build(){
  const wrap = document.getElementById('pillwrap');
  const v = new URLSearchParams(location.search).get('variant')||'a';
  render.variant = ['a','b','c'].includes(v) ? v : 'a';
  wrap.innerHTML = `
    <div class="pillA" id="pa">
      <span class="dot"></span>
      <div class="meters"></div>
      <span class="label"></span>
      <span class="hint"></span>
      <div class="ctrl">
        <button class="btn cancel" data-act="cancel" title="cancel">&#10005;</button>
        <button class="btn stop"   data-act="stop"   title="stop">&#9632;</button>
      </div>
      <div class="progress"><i></i></div>
    </div>

    <div class="pillB" id="pb" style="display:none">
      <div class="grip"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="main">
        <span class="lbl"></span><span class="sub"></span><span class="errmsg"></span>
      </div>
      <div class="meters"></div>
      <div class="actions">
        <button class="btn cancel" data-act="cancel" title="cancel">&#10005;</button>
        <button class="btn stop"   data-act="stop"   title="stop">&#9632;</button>
      </div>
      <span class="state-chip"></span>
      <div class="progress"><i></i></div>
    </div>

    <div class="pillC" id="pc" style="display:none">
      <div class="orbwrap">
        <svg class="ring" width="52" height="52">
          <circle class="track" cx="26" cy="26" r="22"/>
          <circle class="lvl" cx="26" cy="26" r="22" stroke-dasharray="138.23" stroke-dashoffset="138.23"/>
        </svg>
        <div class="orbcore"></div>
        <button class="pillbtn stop" data-act="stop" title="stop">&#9632;</button>
      </div>
      <div class="chip">
        <span class="lbl"></span><span class="sub"></span>
        <span class="ping"><i></i>hands-free · tap to stop</span>
      </div>
      <span class="hit"></span>
    </div>`;

  render.els = {
    pa: document.getElementById('pa'), pb: document.getElementById('pb'), pc: document.getElementById('pc'),
    a: { meters: pa_m(), label: pa_q('.label'), hint: pa_q('.hint'), prg: pa_q('.progress i') },
    b: { meters: pb_q('.meters'), lbl: pb_q('.lbl'), sub: pb_q('.sub'), errtxt: pb_q('.errmsg'),
         chip: pb_q('.state-chip'), prg: pb_q('.progress i') },
    c: { ring: pc_q('.lvl'), lbl: pc_q('.chip .lbl'), sub: pc_q('.chip .sub'), hit: pc_q('.hit') },
  };
  function pa_m(){ return document.getElementById('pa').querySelector('.meters'); }
  function pa_q(s){ return document.getElementById('pa').querySelector(s); }
  function pb_q(s){ return document.getElementById('pb').querySelector(s); }
  function pc_q(s){ return document.getElementById('pc').querySelector(s); }
  syncVariantDOM();
}
function syncVariantDOM(){
  render.els.pa.style.display = render.variant==='a' ? '' : 'none';
  render.els.pb.style.display = render.variant==='b' ? '' : 'none';
  render.els.pc.style.display = render.variant==='c' ? '' : 'none';
}

/* one reusable bar set per variant with live host references */
const barSets = {};
function barSet(key, n, lvl){
  const host = render.els[key].meters;
  let slot = barSets[key];
  if (!slot){ slot = barSets[key] = { n:-1, ph:[] }; }
  if (slot.n !== n){ slot.n = n; slot.ph = Array.from({length:n},()=>Math.random()*Math.PI*2); }
  while (host.children.length < n) host.appendChild(document.createElement('i'));
  while (host.children.length > n) host.removeChild(host.lastChild);
  for (let i=0;i<n;i++){
    const b = host.children[i];
    const w = n>1 ? Math.pow(Math.sin(Math.PI*i/(n-1)), 0.55) : 1; // hann-ish weighting
    const wob = 0.72 + 0.28*Math.sin(engine.t*9 + slot.ph[i]);
    const h = lvl>0 ? Math.max(2, Math.round(w*lvl*wob*barlen(n))) : 2; // 2px = STILL
    b.style.height = h+'px';
  }
}
function barlen(n){ return Math.max(8, Math.min(44, n)); }

function paint(){
  const st = engine.state;
  const hf = HF();
  const cls = hf ? ('state-'+st+' state-handsfree') : ('state-'+st);
  const t = st==='error' ? ERR_TXT[engine.error||'mic'] : STATE_TXT[st];

  if (render.variant==='a'){
    const el = render.els.a;
    render.els.pa.className = 'pillA '+cls;
    el.label.textContent = st==='error' ? t.lbl : (st==='idle' ? '' : t.a);
    el.hint.textContent  = hf ? 'hands-free · release to stop' : (st==='error' ? t.c : t.c);
    const n = (st==='transcribing') ? 44 : (st==='listening' ? 44 : (st==='idle' ? 12 : 28));
    let lvl = 0;
    if (st==='listening')            lvl = engine.level;
    else if (st==='transcribing')    lvl = 0.06;   // whisper busy: calm breathing
    else if (st==='cleaning')        lvl = 0.03;
    else if (st==='inserting')       lvl = 0.02;
    else if (st==='done')            lvl = 0.00;
    barSet('a', n, lvl);
    el.prg.style.width = (engine.progress*100)+'%';
  }

  if (render.variant==='b'){
    const el = render.els.b;
    render.els.pb.className = 'pillB '+cls;
    el.chip.textContent = st;
    if (st==='error'){
      el.lbl.style.display='none'; el.errtxt.style.display='inline';
      el.errtxt.textContent = t.lbl+' — '+t.sub;
    } else {
      el.lbl.style.display='inline'; el.errtxt.style.display='none';
      el.lbl.textContent = t.b;
      el.sub.textContent  = hf ? 'hands-free · tap Stop to end' : t.bs;
    }
    const n = (st==='listening'||st==='transcribing'||st==='cleaning'||st==='inserting') ? 26 : 0;
    let lvl = 0;
    if (st==='listening')   lvl = engine.level;
    else if (st==='transcribing') lvl = 0.07;
    else if (st==='cleaning')     lvl = 0.04;
    else if (st==='inserting')    lvl = 0.03;
    barSet('b', n, lvl);
    el.prg.style.width = (engine.progress*100)+'%';
  }

  if (render.variant==='c'){
    const el = render.els.c;
    render.els.pc.className = 'pillC '+cls;
    if (st==='error'){ el.lbl.textContent = t.c; el.sub.textContent = t.sub; }
    else { el.lbl.textContent = t.c; el.sub.textContent = st==='idle' ? '' : (hf?'hands-free':'tone · precise'); }
    const circ = 2*Math.PI*22;
    let sweep = 0;
    if (st==='listening')  sweep = engine.level*circ;
    else if (st==='inserting')       sweep = engine.progress*circ;
    else if (st==='transcribing')    sweep = (Math.sin(engine.t*3)+1)*circ*0.06;
    el.ring.setAttribute('stroke-dasharray', circ);
    el.ring.setAttribute('stroke-dashoffset', circ-sweep);
  }
}

function paintTele(){
  const tel = document.getElementById('tele');
  tel.innerHTML =
    'state <b>'+engine.state+'</b>'+
    (engine.handsFree ? ' <b class="on">hands-free</b>' : '')+
    'src <b>'+engine.src+'</b>'+
    'speaking <b>'+engine.speaking+'</b>'+
    'rms <b>'+(engine.db<=-70?'−inf':engine.db.toFixed(1)+' dB')+'</b>'+
    'gate <span class="'+(engine.gated?'off':'on')+'">'+(engine.gated?'SILENT':'LIVE')+'</span>'+
    'bars <span class="'+(engine.level>0?'on':'off')+'">'+(engine.level>0?'moving':'STILL')+'</span>';
}

/* ---------- frame loop ---------- */
function frame(){
  requestAnimationFrame(frame);
  engine.t += 1/60;
  let target;
  if (engine.src==='mic' && engine.micAn) target = micRms();
  else target = (engine.speaking || (engine.handsFree && engine.state==='listening')) ? speechSample(engine.t) : 0.00035;
  const coef = target>engine.smooth ? ACOEF : RCOEF;
  engine.smooth += (target-engine.smooth)*coef;
  engine.db = 20*Math.log10(engine.smooth+1e-9);
  if (engine.db <= GATE.on) engine.gated = true;
  else if (engine.db >= GATE.off) engine.gated = false;
  engine.level = engine.gated ? 0 : Math.min(1, (engine.db-GATE.on)/(0-GATE.on)*1.12);
  if (engine.state==='inserting') engine.progress = Math.min(1, engine.progress + 1/(60*1.3));
  paint();
  if (IS_PROTO) paintTele();
}

/* ---------- controls ---------- */
const controls = document.getElementById('controls');
controls.innerHTML =
  '<div class="grp"><span class="cap">states</span>'+
    '<button class="btn" id="ctl-idle">Idle</button>'+
    '<button class="btn" id="ctl-listen">Listen</button>'+
    '<button class="btn" id="ctl-transcribe">Transcribe</button>'+
    '<button class="btn" id="ctl-clean">Clean</button>'+
    '<button class="btn" id="ctl-insert">Insert</button>'+
    '<button class="btn" id="ctl-done">Done</button>'+
    '<select id="ctl-errkind"><option value="mic">mic offline</option><option value="model">model missing</option><option value="key">no Groq key</option></select>'+
    '<button class="btn" id="ctl-error">Error</button>'+
  '</div>'+
  '<div class="grp"><span class="cap">session</span>'+
    '<button class="btn" id="ctl-cancel">&#10005; cancel</button>'+
    '<button class="btn handsfree" id="ctl-hf">Hands-free</button>'+
    '<button class="btn" id="ctl-stop">Stop &amp; insert</button>'+
  '</div>'+
  '<div class="grp"><span class="cap">input</span>'+
    '<button class="btn speak" id="ctl-speak">Hold to speak</button>'+
    '<button class="btn" id="ctl-mic">Real mic</button>'+
  '</div>'+
  '<div class="grp"><span class="cap">theme</span>'+
    '<button class="btn" id="ctl-theme">Dark / Light</button>'+
  '</div>';

const $ = id => document.getElementById(id);
$('ctl-idle').addEventListener('click', ()=>setState('idle'));
$('ctl-listen').addEventListener('click', ()=>startSession());
$('ctl-transcribe').addEventListener('click', ()=>chainTo('transcribing'));
$('ctl-clean').addEventListener('click', ()=>chainTo('cleaning'));
$('ctl-insert').addEventListener('click', ()=>chainTo('inserting'));
$('ctl-done').addEventListener('click', ()=>finishInsert());
$('ctl-error').addEventListener('click', ()=>setError($('ctl-errkind').value));
$('ctl-cancel').addEventListener('click', ()=>cancel());
$('ctl-stop').addEventListener('click', ()=>{ if (engine.state==='listening') endListening(); });
$('ctl-hf').addEventListener('click', ()=>{
  engine.handsFree = !engine.handsFree;
  $('ctl-hf').classList.toggle('active', engine.handsFree);
  if (engine.handsFree && engine.state==='idle') startSession();
  if (!engine.handsFree && engine.state==='listening') setState('idle');
  ping(engine.handsFree);
});
/* hold-to-speak (mouse + space) */
const spkBtn = $('ctl-speak');
function holdOn(e){ if(e) e.preventDefault(); engine.speaking=true; spkBtn.classList.add('active');
                    if (engine.state==='idle') startSession(); }
function holdOff(){ engine.speaking=false; spkBtn.classList.remove('active');
                    if (engine.state==='listening') endListening(); }
spkBtn.addEventListener('pointerdown', holdOn);
window.addEventListener('pointerup', holdOff);
window.addEventListener('keydown', e=>{
  if (e.code==='Space' && !isEditable(e.target)){ e.preventDefault(); if(!engine.speaking){ engine.speaking=true; if (engine.state==='idle') startSession(); } }
  if (e.code==='Escape') cancel();
});
window.addEventListener('keyup', e=>{ if (e.code==='Space'){ engine.speaking=false; if (engine.state==='listening') endListening(); } });
function isEditable(t){ return t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable); }
$('ctl-mic').addEventListener('click', async ()=>{ const ok = await enableMic(); $('ctl-mic').classList.toggle('active', ok); });
$('ctl-theme').addEventListener('click', ()=>{
  const r = document.documentElement;
  r.setAttribute('data-theme', r.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
});

/* in-pill affordances: stop / cancel */
document.getElementById('pillwrap').addEventListener('click', e=>{
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act==='stop'){ if (engine.state==='listening') endListening(); }
  if (act.dataset.act==='cancel') cancel();
});

/* drag-to-move (affordance demo) */
const pillwrap = document.getElementById('pillwrap');
let drag = null;
pillwrap.addEventListener('pointerdown', e=>{
  if (e.target.closest('button')) return;
  const r = pillwrap.getBoundingClientRect();
  drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
  pillwrap.style.left = r.left+'px';
  pillwrap.style.top  = r.top+'px';
  pillwrap.style.transform = 'none';
  pillwrap.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('pointermove', e=>{
  if (!drag) return;
  const sr = document.querySelector('.stage').getBoundingClientRect();
  let x = e.clientX - drag.dx - sr.left, y = e.clientY - drag.dy - sr.top;
  x = Math.max(0, Math.min(sr.width - pillwrap.offsetWidth, x));
  y = Math.max(0, Math.min(sr.height - pillwrap.offsetHeight, y));
  pillwrap.style.left = x+'px';
  pillwrap.style.top  = y+'px';
});
window.addEventListener('pointerup', ()=>{ drag=null; pillwrap.classList.remove('dragging'); });

/* ---------- variant switcher ---------- */
const VARIANTS = [ {id:'a', name:'capsule dock'}, {id:'b', name:'status console'}, {id:'c', name:'the orb'} ];
function currentIdx(){ return Math.max(0, VARIANTS.findIndex(v=>v.id===render.variant)); }
function setVariant(i){
  const idx = ((i % VARIANTS.length)+VARIANTS.length)%VARIANTS.length;
  render.variant = VARIANTS[idx].id;
  const u = new URL(location.href); u.searchParams.set('variant', render.variant);
  history.replaceState(null,'',u);
  document.getElementById('vlabel').innerHTML =
    '<b>'+render.variant.toUpperCase()+' — '+VARIANTS[idx].name+'</b><small>'+idx+1+' of '+VARIANTS.length+' · &#8592;/&#8594; to switch</small>';
  syncVariantDOM();
}
document.getElementById('vprev').addEventListener('click', ()=>setVariant(currentIdx()-1));
document.getElementById('vnext').addEventListener('click', ()=>setVariant(currentIdx()+1));
window.addEventListener('keydown', e=>{
  if (e.target.tagName==='SELECT'||e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key==='ArrowLeft'){ e.preventDefault(); setVariant(currentIdx()-1); }
  if (e.key==='ArrowRight'){ e.preventDefault(); setVariant(currentIdx()+1); }
});
if (!IS_PROTO) document.getElementById('vsw').style.display='none';

/* boot */
build();
setVariant(currentIdx());
requestAnimationFrame(frame);
</script>
