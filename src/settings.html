<head>

      background: #0b0d12; color: #cfd6e4;

    p { color: #5b6377; font-size: 12px; }
  </style>
</head>
<body>
  <div class="mark">
    <i style="height:6px"></i><i style="height:10px"></i><i style="height:13px"></i><i style="height:10px"></i><i style="height:6px"></i>

</html>
