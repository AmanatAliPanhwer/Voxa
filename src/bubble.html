<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body { position: relative; }
    button.disc {
      position: absolute; left: 4px; top: 4px;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: transparent;
      border: 2px solid rgba(236, 59, 51, .45);
      cursor: pointer;
      padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    button.disc:hover {
      background: #ec3b33;
      border-color: #ec3b33;
      box-shadow: 0 0 0 3px rgba(236, 59, 51, .18);
    }
    .stop {
      width: 8px; height: 8px;
      background: #fff;
      border-radius: 1.5px;
      opacity: 0;
      transition: opacity .15s ease;
    }
    button.disc:hover .stop { opacity: 1; }
  </style>
</head>
<body>
  <button class="disc" title="Stop"><span class="stop"></span></button>
  <script>
    const invoke = window.__TAURI__.core.invoke;
    document.querySelector('button.disc').addEventListener('click', () => {
      invoke('bubble_stop').catch(() => {});
    });
  </script>
</body>
</html>
